name: Deploy WaterSensor prediction on Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - Home

permissions:
  contents: read

jobs:
  deployment:
    runs-on: [self-hosted, python]
    environment: Home
    env:
      REPO: ${{ vars.REPO }}
      TARGET_PATH: ${{ vars.TARGET_PATH }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
      
      - uses: zefek/GithubActions/Actions/deployConfig@main
        with:
          repo:   ${{ env.REPO }} 
          auth:   ${{ secrets.REPO_TOKEN }}
          dest:   ${{ runner.temp }}\secrets
          device: Odecty_Python
          outdir: ${{ env.TARGET_PATH }}

      - name: Kopírování souborů
        shell: powershell
        env:
          TARGET_PATH: ${{ vars.TARGET_PATH }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:TARGET_PATH)) {
            New-Item -ItemType Directory -Path $env:TARGET_PATH -Force | Out-Null
          }
          Copy-Item -Path "$env:GITHUB_WORKSPACE\src\Recognition\*" -Destination $env:TARGET_PATH -Recurse -Force

      - name: Restart služby
        if: always()
        shell: powershell
        run: |
          Start-Service -Name $env:SERVICE_NAME
          (Get-Service -Name $env:SERVICE_NAME).WaitForStatus('Running', '00:01:00')
